name: "Fork release"

# Fork-only release of the x86_64 GNU server binary, built by upstream's own
# Dockerfile.build `binaries` stage (same toolchain and features as upstream
# releases) and published as stalwart-x86_64-unknown-linux-gnu.tar.gz. Tags are
# `oauth2-v<upstream version>` so upstream's `v*.*.*` release pipeline, which
# pushes images to registries this fork does not publish to, never runs.
on:
  push:
    tags: ["oauth2-v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]
          driver-opts: |
            network=host

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}

      - name: Build binary
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          BUILD_ENV: ""
          GHCR_REPO: ghcr.io/${{github.repository}}
        with:
          source: .
          files: docker-bake.hcl
          targets: build

      - name: Package
        run: |
          mkdir -p release
          tar -C artifact -czf "release/stalwart-${TARGET}.tar.gz" stalwart
          (cd release && sha256sum "stalwart-${TARGET}.tar.gz" > "stalwart-${TARGET}.tar.gz.sha256")

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
